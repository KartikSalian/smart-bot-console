name: Keep Render instance awake

on:
  schedule:
    # Every 10 minutes -- comfortably under Render's ~15 min idle spin-down window.
    # Re-pushed 2026-11-17: GitHub's scheduler silently stopped firing this after ~8 hours;
    # re-committing the workflow file re-arms it. If this recurs, investigate further.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://smart-bot-console-api.onrender.com/api/health

name: Keep Render instance awake

on:
  schedule:
    # Every 10 minutes -- comfortably under Render's ~15 min idle spin-down window.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://smart-bot-console-api.onrender.com/api/health
